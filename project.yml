# XcodeGen spec: `xcodegen generate` turns this into OlympicInstitute.xcodeproj (done on the build Mac).
name: OlympicInstitute
options:
  bundleIdPrefix: com.olympicinstitute
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  OlympicInstitute:
    type: application
    platform: iOS
    sources:
      - path: OlympicInstitute
    dependencies:
      - package: SwiftSoup
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: المعهد الأوليمبي
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - Cairo-Regular.ttf
          - Cairo-SemiBold.ttf
          - Cairo-Bold.ttf
          - Cairo-ExtraBold.ttf
          - Tajawal-Regular.ttf
          - Tajawal-Medium.ttf
          - Tajawal-Bold.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Only lets the UI tests reach their local stand-in for the website.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.olympicinstitute.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Names any expression or function that is slow to compile, so the CI log shows what to simplify.
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-expression-type-checking=300 -Xfrontend -warn-long-function-bodies=1000"

  OlympicInstituteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OlympicInstituteTests
    dependencies:
      - target: OlympicInstitute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  OlympicInstituteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OlympicInstituteUITests
    dependencies:
      - target: OlympicInstitute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OlympicInstitute

schemes:
  OlympicInstitute:
    build:
      targets:
        OlympicInstitute: all
    test:
      targets:
        - OlympicInstituteTests
        - OlympicInstituteUITests
      gatherCoverageData: false
