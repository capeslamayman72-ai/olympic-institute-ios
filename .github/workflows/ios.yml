# Builds and tests the app on GitHub's macOS machines (no Mac needed locally), on an iPhone and an iPad
# simulator, then publishes screenshots, the test summary and any build errors to the "ci-latest" release.
name: iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Apple-silicon Macs: Intel simulators took 20+ minutes just to start testing. The iPhone IPA job
    # below stays on Intel, so a busy arm64 queue never holds up the installable build.
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version

      - name: Pick an iPhone and an iPad simulator
        id: sims
        run: |
          xcrun simctl list devices available --json > sims.json
          IPHONE=$(jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone 1[5-7]( Pro)?$"))] | last | .udid' sims.json)
          # Fall back to any iPhone if the usual models are missing on this image.
          [ "$IPHONE" = "null" ] && IPHONE=$(jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | last | .udid' sims.json)
          IPAD=$(jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPad (Air|Pro)"))] | last | .udid' sims.json)
          echo "iphone=$IPHONE" >> "$GITHUB_OUTPUT"
          echo "ipad=$IPAD" >> "$GITHUB_OUTPUT"
          jq -r --arg a "$IPHONE" --arg b "$IPAD" '.devices[][] | select(.udid == $a or .udid == $b) | .name' sims.json
          # Booted up front, so the test runner is never installed on a half-started simulator.
          for d in "$IPHONE" "$IPAD"; do xcrun simctl boot "$d" || true; xcrun simctl bootstatus "$d" -b; done

      # Whole logs go to files for the release; errors, slow-to-compile code and test progress also show live.
      - name: Build
        timeout-minutes: 50
        run: |
          mkdir -p build
          set +e
          xcodebuild build-for-testing \
            -project OlympicInstitute.xcodeproj \
            -scheme OlympicInstitute \
            -destination "id=${{ steps.sims.outputs.iphone }}" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/build.log |
            grep --line-buffered -E "error:|to type-check|Resolve Package Graph|Compiling|\*\* "
          exit "${PIPESTATUS[0]}"

      - name: Test on iPhone and iPad
        timeout-minutes: 35
        run: |
          set +e
          xcodebuild test-without-building \
            -project OlympicInstitute.xcodeproj \
            -scheme OlympicInstitute \
            -derivedDataPath build/dd \
            -destination "id=${{ steps.sims.outputs.iphone }}" \
            -destination "id=${{ steps.sims.outputs.ipad }}" \
            -resultBundlePath build/Results.xcresult \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/xcodebuild.log |
            grep --line-buffered -E "error:|Test Case .*(started|passed|failed)|Test Suite .*started|Executed|Testing started|\*\* "
          exit "${PIPESTATUS[0]}"

      - name: Collect results
        if: always()
        run: |
          mkdir -p build/out/screenshots
          cat build/build.log build/xcodebuild.log 2>/dev/null > build/all.log
          grep -E "error:|fatal error|to type-check|\*\* (BUILD|TEST) FAILED|Failing tests|XCTAssert" build/all.log | head -300 > build/out/errors.txt || true
          tail -120 build/all.log > build/out/log-tail.txt || true
          if [ -d build/Results.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/Results.xcresult > build/out/summary.json || true
            xcrun xcresulttool get test-results tests --path build/Results.xcresult > build/out/tests.json || true
            xcrun xcresulttool export attachments --path build/Results.xcresult --output-path build/attachments || true
            if [ -f build/attachments/manifest.json ]; then
              jq -r '.[] | .attachments[] | "\(.exportedFileName)\t\(.suggestedHumanReadableName)"' build/attachments/manifest.json |
                while IFS=$'\t' read -r file name; do cp "build/attachments/$file" "build/out/screenshots/${name}"; done
            fi
          fi
          (cd build/out && zip -qr ../screenshots.zip screenshots)
          ls -la build/out build/out/screenshots | head -80

      - name: Pack the simulator app
        if: always()
        run: |
          # The app already built for the tests; no second (Release) compile.
          APP=$(find build/dd/Build/Products -name "OlympicInstitute.app" -type d -path "*iphonesimulator*" | head -1)
          if [ -n "$APP" ]; then (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/build/OlympicInstitute-simulator.zip" OlympicInstitute.app); fi

      - name: Publish to the ci-latest release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --yes --cleanup-tag || true
          FILES=""
          for f in build/out/errors.txt build/out/log-tail.txt build/screenshots.zip; do if [ -s "$f" ]; then FILES="$FILES $f"; fi; done
          for f in build/out/summary.json build/out/tests.json build/OlympicInstitute-simulator.zip; do if [ -s "$f" ]; then FILES="$FILES $f"; fi; done
          gh release create ci-latest $FILES --prerelease --target "$GITHUB_SHA" \
            --title "CI build ${{ github.run_number }}" --notes "Automatic build of ${GITHUB_SHA::7}: screenshots, test summary and errors."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: build/out

  # An unsigned build for real iPhones and iPads, built alongside the tests on a second machine. Without an
  # Apple Developer account it is installed with Sideloadly on Windows, which signs it with the student's own
  # Apple ID (valid 7 days); with an account it would go to TestFlight instead.
  iphone-ipa:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone and iPad
        timeout-minutes: 70
        run: |
          mkdir -p build
          set +e
          xcodebuild build \
            -project OlympicInstitute.xcodeproj \
            -scheme OlympicInstitute \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build/device.log |
            grep --line-buffered -E "error:|to type-check|\*\* "
          exit "${PIPESTATUS[0]}"

      - name: Pack the IPA
        run: |
          APP=build/device/Build/Products/Release-iphoneos/OlympicInstitute.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../OlympicInstitute.ipa Payload)
          ls -la build/OlympicInstitute.ipa

      - name: Publish to the iphone-app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone-app --yes --cleanup-tag || true
          gh release create iphone-app build/OlympicInstitute.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iPhone app (unsigned) ${GITHUB_SHA::7}" \
            --notes "Unsigned build for real iPhones and iPads. Install it with Sideloadly using your Apple ID."
